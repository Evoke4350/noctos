name: Feature request
description: Propose an evidence-based CBT-I addition or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Read `CONTRIBUTING.md` "What does not get merged" before filing. Sleep scores, gamification, cloud sync, wearable scoring, and non-CBT-I "alternatives" will be closed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user/clinical problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Cite peer-reviewed CBT-I literature (Morin, Espie, Edinger, etc.) or AASM/ESRS guidelines. Blog posts and pop-sci don't count.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
