name: build-macos

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macos .app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - run: flutter build macos --release

      - name: zip .app
        run: |
          cd build/macos/Build/Products/Release
          zip -ry noctos-macos.zip noctos.app

      - uses: actions/upload-artifact@v4
        with:
          name: noctos-macos
          path: build/macos/Build/Products/Release/noctos-macos.zip
