name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter config --enable-web
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: build web
        run: flutter build web --release --base-href /app/ --pwa-strategy=none

      - name: assemble pages output
        run: |
          mkdir -p _pages
          cp -r site/. _pages/
          mkdir -p _pages/app
          cp -r build/web/. _pages/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
